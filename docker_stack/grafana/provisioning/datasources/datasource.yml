apiVersion: 1

datasources:
  - name: PostgreSQL
    uid: postgres_uid
    type: postgres
    access: proxy
    url: timescaledb:5432

    user: postgres

    secureJsonData:
      password: postgres

    jsonData:
      database: postgres
      sslmode: disable
      postgresVersion: 1500
      timescaledb: true

    isDefault: true
    editable: true